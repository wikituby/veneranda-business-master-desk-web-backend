# mobile-money.mtn.api-user=
# mobile-money.mtn.api-key=
mobile-money.mtn.target-environment=sandbox
mobile-money.airtel.base-url=https://openapiuat.airtel.africa
# Optional fallback — leave unset; use Admin UI instead
# mobile-money.airtel.client-id=
# mobile-money.airtel.client-secret=
mobile-money.airtel.country=UG
mobile-money.airtel.currency=UGX

