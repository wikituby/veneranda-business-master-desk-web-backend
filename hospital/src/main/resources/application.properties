
quarkus.http.host=0.0.0.0
# Render injects PORT; local default 8080
quarkus.http.port=${PORT:8080}
# Legacy context path kept for compatibility; product is Veneranda Business Master (VBM)
quarkus.http.root-path=/health_care
quarkus.application.name=Veneranda Business Master
quarkus.application.version=1.0.0

quarkus.http.body.handle-file-uploads=true


quarkus.package.jar.type=uber-jar


#############################
# Datasource Configuration
# Local/default: PostgreSQL. Production (Render): PostgreSQL via env + %prod.
#############################
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/vena
quarkus.datasource.reactive.url=postgresql://localhost:5432/vena
quarkus.datasource.jdbc.driver=org.postgresql.Driver

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/vena
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5432/vena
%dev.quarkus.datasource.jdbc.driver=org.postgresql.Driver

# Production / Render (Supabase Postgres) — set QUARKUS_PROFILE=prod
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_REACTIVE_URL}
%prod.quarkus.datasource.jdbc.driver=org.postgresql.Driver
%prod.quarkus.hibernate-orm.database.generation=update

# Keep long filter-visits ranges from dying mid-query
quarkus.datasource.jdbc.max-size=30
quarkus.datasource.jdbc.min-size=3
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.transaction-manager.default-transaction-timeout=300S
quarkus.http.idle-timeout=5M
quarkus.http.read-timeout=5M

#############################
# Hibernate ORM Configuration
#############################
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# PC folder for product catalog images (created automatically if missing).
# Default: {user.home}/VenerandaBusinessMaster/product-images
# vbm.product-images.dir=C:/VenerandaBusinessMaster/product-images

#############################
# JWT Security Configuration
#############################
quarkus.smallrye-jwt.enabled=true

#############################
# Swagger/OpenAPI Configuration
# App APIs live under quarkus.http.root-path=/health_care (legacy path; VBM).
# Controllers use Client-management and Business-item roots.
# Non-app endpoints (Swagger UI + OpenAPI doc) stay at the HTTP root:
#   UI:   http://<host>:8080/q/swagger-ui/
#   Spec: http://<host>:8080/swagger
#############################
quarkus.smallrye-openapi.path=/swagger
quarkus.smallrye-openapi.auto-add-server=true
mp.openapi.servers=/health_care
mp.openapi.info.title=Veneranda Business Master API
mp.openapi.info.version=1.0.0
mp.openapi.info.description=Veneranda Business Master (VBM) — clients, inventory, sales, finance, and administration. Legacy hospital paths are rewritten to Client-management / Business-item.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui/
# Must match the real OpenAPI path (NOT under /health_care — that caused Failed to fetch)
quarkus.swagger-ui.urls.default=/swagger
quarkus.swagger-ui.urls-primary-name=default
quarkus.swagger-ui.theme=original
quarkus.swagger-ui.doc-expansion=none
quarkus.swagger-ui.operations-sorter=method

# Allow Angular on any machine / port when talking to this API over LAN
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-skip-connection-modal
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
quarkus.http.cors.access-control-allow-credentials=true

#############################
