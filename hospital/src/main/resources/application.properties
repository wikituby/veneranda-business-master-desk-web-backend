#############################
# Backup Configuration
#############################
backup.mysqldump-path=mysqldump
backup.mysql-path=mysql
backup.local-root=C:/MediCenter-Backups
backup.interval-minutes=5

# Mother mobile SQLite snapshot (kmc-latest.db) — requires Python 3 on the clinic PC
backup.mobile-sqlite.enabled=true
# backup.mobile-sqlite.python.executable=C:/Python311/python.exe
backup.mobile-sqlite.script-path=scripts/import_mysql_to_sqlite.py

#############################
# Doctor Assistant LLM — free providers (auto picks first available)
# Groq (recommended): free at console.groq.com — set GROQ_API_KEY or groq.api-key below
# OpenRouter: free models at openrouter.ai — set OPENROUTER_API_KEY
# Ollama: local, no key — install from ollama.com and run `ollama pull llama3.2`
#############################
doctor-assistant.llm.provider=auto
doctor-assistant.llm.base-url=https://api.groq.com/openai/v1
doctor-assistant.llm.default-model=llama-3.3-70b-versatile
doctor-assistant.llm.groq.base-url=https://api.groq.com/openai/v1
doctor-assistant.llm.groq.model=llama-3.3-70b-versatile
doctor-assistant.llm.groq.api-key=${GROQ_API_KEY:}
doctor-assistant.llm.openrouter.base-url=https://openrouter.ai/api/v1
doctor-assistant.llm.openrouter.model=meta-llama/llama-3.3-70b-instruct:free
doctor-assistant.llm.openrouter.api-key=${OPENROUTER_API_KEY:}
doctor-assistant.llm.ollama.base-url=http://127.0.0.1:11434/v1
doctor-assistant.llm.ollama.model=llama3.2

